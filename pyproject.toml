[project]
name = "dlra"
version = "0.1.0"
description = "Diagnosis-Locked Receivables Agent: evidence-to-cash resolution for Indian MSMEs."
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.110",
    "httpx>=0.27",
    "mcp>=2",
    "pydantic>=2",
    "pyyaml>=6",
    "tzdata",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["C408"]

[tool.ruff.lint.per-file-ignores]
"dlra/api.py" = ["B008"]  # FastAPI declares dependencies this way
