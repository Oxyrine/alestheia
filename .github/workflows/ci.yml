name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uvx ruff check dlra tests scripts
      - run: uv run pytest -q
      - run: uv run python -m scripts.replay_demo
      - run: uv export --locked --no-emit-project --format requirements-txt -o requirements.txt
      - run: uvx pip-audit -r requirements.txt --disable-pip
